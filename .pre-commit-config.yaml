repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: terraform-format
        name: Terraform format check
        entry: terraform fmt -check -recursive infra
        language: system
        pass_filenames: false
        files: \.tf$
